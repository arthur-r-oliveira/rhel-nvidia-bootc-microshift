# RHEL 10.1 + MicroShift 4.21 + Red Hat–signed OpenRM NVIDIA (single Containerfile, no precompiled kmod builder).
# Ref: RHEL 10.1 release notes (AI accelerator driver availability), rhel-drivers blog, rhel10-nvidia-gpu-ushift.txt lab transcript.
# Prefer a RHEL 10 subscribed build host so mounted redhat.repo lists RHEL 10 BaseOS/AppStream plus
# Supplementary, Extensions, rhocp-4.21-for-rhel-10-*, and fast-datapath-for-rhel-10-* (OCPBUGS-83693).
#
SINGLE_STAGE_BOOTC=1
RHEL_MAJOR=10
BASE_IMAGE=registry.redhat.io/rhel10/rhel-bootc:10.1
CONFIGURE_BUILD_HOST_EUS=0
EUS_RELEASE=
BUILD_WITH_HOST_RHSM=1
# Mount host redhat.repo into the build (required for rhocp-4.21-for-rhel-10 + Supplementary/Extensions).
BUILD_WITH_HOST_YUM_REPOS=1
USHIFT_VER=4.21
DRIVER_TYPE=passthrough
USE_64K_PAGESIZE=0
IMAGE_VERSION_ID=0.2.0-rhel10-oss
RPM_HOST=redhat.com
VENDOR="Red Hat, Inc."
USER_PASSWD=redhat02
NVDP_IMAGE=nvcr.io/nvidia/k8s-device-plugin:v0.16.2

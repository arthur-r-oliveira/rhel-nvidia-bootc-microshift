# All image build arguments (no defaults in Containerfile / Containerfile.builder — set values here).
# MicroShift 4.20 + image mode RHEL: https://docs.redhat.com/en/documentation/red_hat_build_of_microshift/4.20/html-single/installing_with_image_mode_for_rhel/index
#
# kmod builder: build Containerfile.builder first (same BASE_IMAGE as final) so kernel-devel matches kernel-core.
# Pattern: https://github.com/coreos/fedora-bootc-nvidia (BUILDER_IMAGE + Containerfile.builder).
#   podman build --build-arg-file argfile.conf -f Containerfile.builder -t "${BUILDER_IMAGE}" …
#
# Pin BASE_IMAGE to a digest when you need a reproducible kernel NVR across builder + final.
BASE_IMAGE=registry.redhat.io/rhel9-eus/rhel-9.6-bootc:9.6
#
# Host RHSM (test-build.sh): pin minor + enable EUS repos before podman build (requires sudo/root).
# See https://access.redhat.com/articles/rhel-eus#c5 — standard BaseOS/AppStream and EUS are mutually exclusive.
# Set CONFIGURE_BUILD_HOST_EUS=0 to skip (e.g. Fedora laptop, CI without subscription-manager).
CONFIGURE_BUILD_HOST_EUS=1
EUS_RELEASE=9.6
# Required for EUS kernel-devel inside podman build (mount host redhat.repo + rhsm state); see README / KB 6712511.
# test-build.sh uses :ro,z on these mounts by default (SELinux); BUILD_RHSM_VOLUME_SELINUX_LABEL=none to disable relabel.
# With a read-only yum.repos.d mount, test-build.sh runs scripts/configure-host-nvidia-build-repos.sh on the host first.
BUILD_WITH_HOST_RHSM=1
# CONFIGURE_HOST_NVIDIA_REPOS=0   # skip auto NVIDIA .repo setup on host
# CONFIGURE_HOST_MICROSHIFT_REPOS=0   # skip rhocp + fast-datapath enable on host (container uses --enablerepo)
BUILDER_IMAGE=localhost/microshift-nvidia-kmod-builder:latest

BASE_URL=https://us.download.nvidia.com/tesla
CUDA_VERSION=13.2.51
DRIVER_VERSION=580.126.09
DRIVER_TYPE=passthrough
DISABLE_VGPU_VERSION_CHECK=true
USE_64K_PAGESIZE=0
USHIFT_VER=4.20
IMAGE_VERSION_ID=0.1.0
RPM_HOST=redhat.com
VENDOR="Red Hat, Inc."
# Required: password for the local `redhat` user (same pattern as the MicroShift bootc example).
USER_PASSWD=redhat02
# NVIDIA k8s device plugin (embedded for disconnected installs; must match manifests).
NVDP_IMAGE=nvcr.io/nvidia/k8s-device-plugin:v0.16.2
